      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ms-user
      MYSQL_USER: appuser
      MYSQL_PASSWORD: 1234
    ports:
      - "3307:3306"
    volumes:
      - mysql_auth_data:/var/lib/mysql
