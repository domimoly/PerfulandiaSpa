spring:
  application:
    name: ms-ticket-soporte

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ms-ticket-soporte}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8094}

jwt:
  secret: ${JWT_SECRET:u1tocZpNfuILDtiuMYperfume1u4pKL9D}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true