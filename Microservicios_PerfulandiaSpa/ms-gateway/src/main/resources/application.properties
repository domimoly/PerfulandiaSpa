spring.application.name=ms-gateway
server.port=8080

# ms-auth
spring.cloud.gateway.server.webmvc.routes[0].id=ms-auth
spring.cloud.gateway.server.webmvc.routes[0].uri=http://localhost:8082
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/auth/**

# ms-categoria
spring.cloud.gateway.server.webmvc.routes[1].id=ms-categoria
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://ms-categoria
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/v2/categorias/**

